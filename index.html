<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#061a22"><meta name="description" content="Buraco Arcano: uma mesa de fantasia para jogar Buraco brasileiro no navegador."><link rel="manifest" href="manifest.webmanifest"><title>Buraco Arcano — As Quatro Casas</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23082330'/%3E%3Cpath d='M32 6 52 32 32 58 12 32Z' fill='%23d4a34f'/%3E%3Cpath d='M32 18 42 32 32 46 22 32Z' fill='%231cbeea'/%3E%3C/svg%3E"><link rel="stylesheet" href="src/style.css"><link rel="preload" href="assets/taverna.webp" as="image"></head><body>
<div id="viewport"><main id="stage" aria-label="Mesa de Buraco Arcano">
<div class="ambient" aria-hidden="true"></div><div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<header><button id="menu" class="round-button" aria-label="Menu da partida">☰</button><div class="logo" role="img" aria-label="Buraco Arcano"></div><button class="team-badge" id="score"><span class="shield">♜</span><span>Dupla azul<small id="round">Rodada 1/3</small><em>● <b>○</b> <b>○</b></em></span></button><button id="chat" class="round-button" aria-label="Histórico da mesa">☵</button><button id="settings" class="round-button" aria-label="Configurações">⚙</button></header>
<section class="player partner" data-player="2" aria-label="Parceiro"><div class="portrait-art"></div><div class="ribbon">Parceiro</div><div class="card-count" id="count2">11 cartas</div></section>
<section class="player rival-left" data-player="1" aria-label="Rival 1"><div class="portrait-art"></div><div class="ribbon">Rival 1</div><div class="card-count" id="count1">11 cartas</div></section>
<section class="player rival-right" data-player="3" aria-label="Rival 2"><div class="portrait-art"></div><div class="ribbon">Rival 2</div><div class="card-count" id="count3">11 cartas</div></section>
<section class="meld-panel ornate" aria-label="Sequências da dupla"><button id="meldTeam" class="meld-heading">CANASTRAS <span>⌄</span></button><div class="gold-divider">◆</div><div id="melds"></div><div id="meld-caption">Forme sua primeira sequência</div><div class="corner c1">❧</div><div class="corner c2">❧</div><div class="corner c3">❧</div><div class="corner c4">❧</div></section>
<button id="trashInspect" aria-label="Consultar todas as cartas do lixo">⌕</button><section class="piles" aria-label="Pilhas de cartas"><button class="pile" id="stock" aria-label="Comprar do monte"><span class="stack"><span class="card-back blue-back"></span></span><strong>Monte</strong><span class="pill" id="stockCount">37 cartas</span></button><button class="pile" id="trash" aria-label="Recolher o lixo"><span class="stack discard-stack" id="discardArt"></span><strong>Lixo</strong><span class="pill" id="trashCount">1 carta</span></button><button class="pile" id="dead" aria-label="Consultar mortos"><span class="stack"><span class="card-back purple-back"></span></span><strong>Mortos</strong><span class="pill" id="deadCount">2 × 11</span></button></section>
<section class="player self" data-player="0" aria-label="Você"><div class="portrait-art"></div><div class="ribbon">Você</div><div class="card-count" id="count0">11 cartas</div></section>

<div id="toast" role="status" aria-live="polite"></div><div class="version">AS QUATRO CASAS · MESA LOCAL</div>
</main></div>
