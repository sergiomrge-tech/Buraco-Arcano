name: Qualidade e capturas visuais
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar motor Java nativo
        run: |
          mkdir -p target/java-test
          javac -encoding UTF-8 -d target/java-test src/main/java/com/buracoarcano/GameEngine.java src/test/java/com/buracoarcano/EngineSmokeTest.java
          java -ea -cp target/java-test com.buracoarcano.EngineSmokeTest
      - name: Compilar motor Java para JavaScript com TeaVM
        run: mvn -B -ntp -DskipTests process-classes
      - name: Testar regressao das regras
        run: npm test
      - name: Instalar navegador para captura
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Testar interface em computador e Android
        run: npm run test:visual
      - name: Publicar capturas REAIS para inspecao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-buraco-arcano
          path: screenshots/*.png
          if-no-files-found: ignore
