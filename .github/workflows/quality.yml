name: Qualidade Java e capturas visuais
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar motor Java para navegador usando TeaVM
        run: mvn -B -ntp package -DskipTests
      - name: Testar motor Java real sem navegador
        run: java -cp target/test-classes:target/classes com.buracoarcano.GameEngineSmoke
      - name: Testar regras JS anteriores como regressão
        run: npm test
      - name: Instalar navegador para captura real
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Testar interface Java integrada em computador e Android
        run: npm run test:visual
      - name: Empacotar versão web com motor Java
        run: |
          mkdir -p dist/src dist/web/java
          cp index.html dist/
          cp src/app.js src/java-engine.js src/engine.js src/style.css dist/src/
          cp web/java/engine.js dist/web/java/
      - name: Publicar build web para navegador
        uses: actions/upload-artifact@v4
        with:
          name: jogo-web-java
          path: dist/
          if-no-files-found: error
      - name: Publicar capturas REAIS para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-buraco-arcano
          path: screenshots/*.png
          if-no-files-found: ignore
